<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="utf-8">
<title>提词器 · 需求库</title>
<style>
/* ========== 基础 ========== */
*{box-sizing:border-box}
:root{
  --sans:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --accent:#E8608F; --accent-2:#C94577; --accent-soft:#FDF0F5; --accent-line:rgba(232,96,143,.34);
  --ink:#2A1C23; --ink-2:#5E4A54; --muted:#8C7A82; --dim:#A8979F;
  --line:rgba(70,35,50,.10); --line-2:rgba(70,35,50,.17); --hair:rgba(0,0,0,.09);
  --content:#FFFCFD; --chrome:#F7F1F4; --chrome-2:#F2EAEE;
  --sidebar:rgba(252,247,249,.66); --sheet:#FCF8FA; --field:#FFFFFF; --field-2:#FBF5F7;
  --card:#FFFFFF; --card-line:rgba(70,35,50,.10); --row-hover:rgba(70,35,50,.055);
  --todo:#E8608F; --idea:#C98A24; --done:#1E9E74; --promoted:#7C5CD6; --ainew:#3B7DD8; --void:#A6949C;
  --warn:#DE4F58; --warn-bg:#FDF0F1; --warn-line:rgba(222,79,88,.3);
  --ok:#1E9E74; --ok-bg:#EEF8F4;
  --sh-win:0 30px 74px -22px rgba(56,24,38,.5),0 8px 22px -8px rgba(56,24,38,.22),inset 0 0 0 1px rgba(255,255,255,.6);
  --sh-menu:0 12px 34px -8px rgba(40,20,30,.32),0 2px 8px rgba(40,20,30,.14);
  --sh-pop:0 10px 30px -10px rgba(40,20,30,.36),0 2px 8px rgba(40,20,30,.14);
  --r-win:11px; --r-btn:6px; --r-card:8px; --r-row:5px;
}
[data-theme="night"]{
  --accent:#FF6FA5; --accent-2:#FFA6C6; --accent-soft:rgba(255,111,165,.15); --accent-line:rgba(255,111,165,.44);
  --ink:#F6EEF3; --ink-2:#CBB8C4; --muted:#A2919C; --dim:#8B7A85;
  --line:rgba(255,255,255,.11); --line-2:rgba(255,255,255,.19); --hair:rgba(0,0,0,.5);
  --content:#120D16; --chrome:#1A131F; --chrome-2:#221926;
  --sidebar:rgba(26,18,31,.62); --sheet:#171020; --field:rgba(255,255,255,.06); --field-2:rgba(255,255,255,.04);
  --card:rgba(255,255,255,.055); --card-line:rgba(255,255,255,.10); --row-hover:rgba(255,255,255,.07);
  --todo:#FF6FA5; --idea:#FFC46B; --done:#5EE6C8; --promoted:#B79BFF; --ainew:#7FB4FF; --void:#8E7C88;
  --warn:#FF7E8C; --warn-bg:rgba(255,126,140,.13); --warn-line:rgba(255,126,140,.3);
  --ok:#5EE6C8; --ok-bg:rgba(94,230,200,.12);
  --sh-win:0 34px 80px -20px rgba(0,0,0,.85),0 10px 26px -10px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.07);
  --sh-menu:0 16px 40px -10px rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.5);
  --sh-pop:0 12px 34px -10px rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.5);
}
html,body{height:100%}
body{
  margin:0;padding:0;overflow:hidden;color:var(--ink);
  font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:#F3E7EA;
}
[data-theme="night"] body{background:#0B0710}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:default}
[hidden]{display:none!important}
::selection{background:rgba(232,96,143,.22)}
[data-theme="night"] ::selection{background:rgba(255,111,165,.3)}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-thumb{background:rgba(90,50,65,.24);border-radius:6px}
[data-theme="night"] *::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2)}
*::-webkit-scrollbar-track{background:transparent}
kbd{font:10px/1 var(--mono);color:var(--muted);letter-spacing:.02em}

/* ========== 桌面 ========== */
#screen{position:relative;width:1440px;height:900px;overflow:hidden}
.wallpaper{
  position:absolute;inset:0;
  background:
    radial-gradient(760px 500px at 14% 6%,rgba(255,196,214,.55),transparent 70%),
    radial-gradient(820px 560px at 92% 96%,rgba(255,220,228,.5),transparent 72%),
    linear-gradient(158deg,#F7E9EE 0%,#EFDDE4 46%,#F6E6EC 100%);
}
.wallpaper::after{
  content:"";position:absolute;inset:0;opacity:.5;
  background:radial-gradient(340px 240px at 74% 12%,rgba(255,255,255,.6),transparent 70%);
}
[data-theme="night"] .wallpaper{
  background:
    radial-gradient(720px 480px at 16% 4%,rgba(255,111,165,.22),transparent 70%),
    radial-gradient(780px 520px at 90% 98%,rgba(160,120,255,.18),transparent 74%),
    linear-gradient(160deg,#150D1C 0%,#0B0710 52%,#120A16 100%);
}
[data-theme="night"] .wallpaper::after{opacity:.28;background:radial-gradient(320px 220px at 72% 14%,rgba(255,255,255,.10),transparent 70%)}

/* ========== 系统菜单栏 ========== */
.menubar{
  position:absolute;left:0;top:0;width:1440px;height:24px;z-index:90;
  display:flex;align-items:center;padding:0 10px;gap:2px;
  background:rgba(252,247,249,.62);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);
  border-bottom:1px solid rgba(70,35,50,.10);color:#33232B;font-size:12px;
}
[data-theme="night"] .menubar{background:rgba(22,14,27,.62);border-bottom-color:rgba(255,255,255,.1);color:#F3E9EF}
.mb-left{display:flex;align-items:center;gap:1px;margin-left:-2px}
.mb-item{padding:2px 9px;border-radius:4px;font-weight:500;letter-spacing:.01em}
.mb-item:hover,.mb-item.on{background:rgba(232,96,143,.16)}
[data-theme="night"] .mb-item:hover,[data-theme="night"] .mb-item.on{background:rgba(255,111,165,.24)}
.mb-item.on{background:rgba(232,96,143,.9);color:#fff}
[data-theme="night"] .mb-item.on{background:var(--accent);color:#1A0F14}
.mb-apple{width:24px;height:18px;display:grid;place-items:center;border-radius:4px;color:#3B2830}
[data-theme="night"] .mb-apple{color:#F3E9EF}
.mb-apple:hover{background:rgba(232,96,143,.16)}
.mb-apple svg{display:block}
.mb-right{margin-left:auto;display:flex;align-items:center;gap:12px;color:#4A3741;font-size:11.5px}
[data-theme="night"] .mb-right{color:#DCCCD6}
.mb-right .mbi{opacity:.8;display:flex;align-items:center}
.mbmenu{
  position:absolute;z-index:95;min-width:232px;padding:5px;border-radius:7px;
  background:rgba(252,249,250,.97);border:1px solid rgba(70,35,50,.14);box-shadow:var(--sh-menu);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
}
[data-theme="night"] .mbmenu{background:rgba(38,27,43,.97);border-color:rgba(255,255,255,.14)}
.mbmenu .mrow{
  display:flex;align-items:center;gap:10px;height:24px;padding:0 9px;border-radius:5px;font-size:12.5px;color:var(--ink);width:100%;text-align:left;
}
.mbmenu .mrow:hover{background:var(--accent);color:#fff}
[data-theme="night"] .mbmenu .mrow:hover{color:#1A0F14}
.mbmenu .mrow.disabled{color:var(--dim)}
.mbmenu .mrow.disabled:hover{background:transparent;color:var(--dim)}
.mbmenu .mrow .mk{margin-left:auto;font:10.5px var(--mono);color:var(--muted);padding-left:16px}
.mbmenu .mrow:hover .mk{color:rgba(255,255,255,.9)}
.mbmenu .msep{height:1px;background:var(--line);margin:5px 8px}
.mbmenu .mhead{font-size:10.5px;color:var(--muted);padding:3px 9px 4px;letter-spacing:.02em}

/* ========== 窗口 ========== */
.win{
  position:absolute;left:60px;top:32px;width:1320px;height:860px;border-radius:var(--r-win);
  display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh-win);
  border:1px solid rgba(255,255,255,.55);background:var(--content);
}
[data-theme="night"] .win{border-color:rgba(255,255,255,.10)}
.titlebar{
  position:relative;height:46px;flex:0 0 46px;display:flex;align-items:center;gap:12px;padding:0 14px;
  background:rgba(252,247,249,.62);-webkit-backdrop-filter:blur(28px) saturate(1.8);backdrop-filter:blur(28px) saturate(1.8);
  border-bottom:1px solid var(--line);z-index:12;
}
[data-theme="night"] .titlebar{background:rgba(24,16,29,.6)}
.traffic{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.traffic button{
  width:12px;height:12px;border-radius:50%;display:grid;place-items:center;position:relative;
  font:9px/1 var(--sans);color:rgba(0,0,0,.55);border:0;
}
.traffic button:nth-child(1){background:#FF5F57}
.traffic button:nth-child(2){background:#FEBC2E}
.traffic button:nth-child(3){background:#28C840}
[data-theme="night"] .traffic button{color:rgba(0,0,0,.6)}
.traffic button span{opacity:0;transition:opacity .12s;font-weight:700}
.traffic:hover button span{opacity:1}
.traffic button:active{filter:brightness(.9)}
.doc-title{
  position:absolute;left:0;right:0;text-align:center;font-size:12.5px;font-weight:600;color:var(--ink);
  pointer-events:none;letter-spacing:.01em;
}
.doc-title i{font-style:normal;font-weight:400;color:var(--muted)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;z-index:2}
.draft{font-size:9.5px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.tb-ic{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.tb-ic:hover{background:var(--row-hover);color:var(--ink)}
.live{width:6px;height:6px;border-radius:50%;background:var(--done);display:inline-block;box-shadow:0 0 0 2px rgba(30,158,116,.16)}

/* ========== 工具栏 ========== */
.toolbar{
  height:40px;flex:0 0 40px;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:var(--chrome);border-bottom:1px solid var(--line);z-index:11;
}
.segmented{
  display:flex;align-items:center;padding:2px;border-radius:7px;background:var(--field-2);
  border:1px solid var(--line);height:26px;gap:2px;
}
.segmented button{
  height:20px;padding:0 10px;border-radius:5px;display:flex;align-items:center;gap:5px;
  font-size:11.5px;color:var(--ink-2);
}
.segmented button svg{opacity:.7}
.segmented button:hover{color:var(--ink)}
.segmented button[aria-selected="true"]{
  background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(40,20,30,.16),inset 0 0 0 .5px rgba(70,35,50,.14);
}
[data-theme="night"] .segmented button[aria-selected="true"]{background:rgba(255,255,255,.14);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.segmented button[aria-selected="true"] svg{opacity:.95;color:var(--accent)}
.pending-badge{
  display:flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;
  border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent-2);
  font-size:11.5px;font-weight:600;
}
.pending-badge b{font:11px var(--mono);background:var(--accent);color:#fff;border-radius:9px;padding:0 5px;line-height:15px}
[data-theme="night"] .pending-badge b{color:#1A0F14}
.pending-badge:hover{border-color:var(--accent)}
.pending-badge.zero{opacity:.62;border-color:var(--line);background:transparent;color:var(--muted)}
.pending-badge.zero b{background:var(--dim)}
.tb-spacer{flex:1}
.searchfield{
  display:flex;align-items:center;gap:6px;height:24px;width:204px;padding:0 7px;border-radius:6px;
  background:var(--field);border:1px solid var(--line);color:var(--muted);
}
[data-theme="night"] .searchfield{background:rgba(255,255,255,.07)}
.searchfield:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px rgba(232,96,143,.14)}
.searchfield input{border:0;outline:none;background:none;width:100%;font-size:12px;color:var(--ink)}
.searchfield input::placeholder{color:var(--muted)}
.btn{
  height:24px;padding:0 9px;border-radius:var(--r-btn);border:1px solid var(--line);
  background:var(--field);display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink);white-space:nowrap;
}
[data-theme="night"] .btn{background:rgba(255,255,255,.08)}
.btn:hover{background:var(--field-2);border-color:var(--line-2)}
.btn kbd{color:var(--dim)}
.btn-primary{
  height:24px;padding:0 10px;border-radius:var(--r-btn);background:var(--accent);color:#fff;
  border:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 2px rgba(160,40,80,.25);
}
.btn-primary:hover{background:var(--accent-2)}
[data-theme="night"] .btn-primary{color:#1A0F14}
.btn-primary kbd{color:rgba(255,255,255,.82)}
[data-theme="night"] .btn-primary kbd{color:rgba(20,10,15,.66)}
.popbtn{
  height:24px;padding:0 8px;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--field);
  display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);
}
.popbtn:hover{background:var(--field-2)}
.popmenu{
  position:absolute;z-index:70;min-width:150px;padding:5px;border-radius:7px;background:var(--sheet);
  border:1px solid var(--line-2);box-shadow:var(--sh-pop);
}
.popmenu button{display:flex;align-items:center;gap:8px;width:100%;height:24px;padding:0 8px;border-radius:5px;font-size:12px;text-align:left}
.popmenu button:hover{background:var(--accent);color:#fff}
[data-theme="night"] .popmenu button:hover{color:#1A0F14}
.popmenu button .ck{margin-left:auto;font-size:11px;opacity:.9}
.popmenu .msep{height:1px;background:var(--line);margin:4px 6px}

/* ========== 工作区 / 侧栏 ========== */
.workspace{flex:1;display:flex;min-height:0}
.sidebar{
  width:248px;flex:0 0 248px;display:flex;flex-direction:column;min-height:0;
  background:var(--sidebar);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);
  border-right:1px solid var(--line);
}
[data-theme="night"] .sidebar{background:rgba(26,18,31,.66)}
.sb-scroll{flex:1;overflow-y:auto;padding:10px 10px 4px}
.sb-group{display:flex;align-items:center;gap:6px;height:22px;padding:0 6px;margin-top:8px}
.sb-group:first-child{margin-top:0}
.sb-label{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.sb-hint{margin-left:auto;font-size:10px;color:var(--dim);display:flex;gap:6px;align-items:center}
.sb-hint button{font-size:10px;color:var(--accent-2)}
.sb-hint button:hover{text-decoration:underline}
.switch{display:flex;align-items:center;gap:5px;margin-left:auto;font-size:10px;color:var(--muted)}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .sw{width:24px;height:14px;border-radius:8px;background:var(--line-2);position:relative;transition:background .16s}
.switch .sw::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .16s}
.switch input:checked + .sw{background:var(--accent)}
.switch input:checked + .sw::after{transform:translateX(10px)}
.sb-list{display:flex;flex-direction:column;gap:1px}
.row{
  display:flex;align-items:center;gap:7px;height:28px;padding:0 7px;border-radius:var(--r-row);
  font-size:12.5px;color:var(--ink);width:100%;text-align:left;
}
.row:hover{background:var(--row-hover)}
.row.sel{background:var(--accent);color:#fff;font-weight:600}
[data-theme="night"] .row.sel{color:#1A0F14}
.row .dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px;background:var(--tone,var(--dim))}
.row.sel .dot{background:#fff;opacity:.9}
[data-theme="night"] .row.sel .dot{background:#1A0F14}
.row .cnt{margin-left:auto;font:10.5px var(--mono);color:var(--muted)}
.row.sel .cnt{color:rgba(255,255,255,.85)}
[data-theme="night"] .row.sel .cnt{color:rgba(20,10,15,.7)}
.row.pend .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
.row.more{color:var(--muted);font-size:11px;height:24px}
.sb-empty{padding:2px 8px 6px;font-size:11px;color:var(--dim)}
.sb-foot{
  flex:0 0 auto;height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;
  border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);
}
.sb-foot .sync{display:flex;align-items:center;gap:5px;white-space:nowrap}
.sb-foot button{margin-left:auto;font-size:10.5px;color:var(--accent-2)}
.sb-foot button:hover{text-decoration:underline}

/* ========== 主区 ========== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--content)}
.main-head{
  flex:0 0 44px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);
  background:var(--content);
}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);min-width:0}
.crumb .path{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .path b{color:var(--ink);font-weight:600}
.crumb .path i{font-style:normal;color:var(--dim);margin:0 3px}
.merge{font-size:10px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent-2);border-radius:999px;padding:1px 7px;white-space:nowrap}
.cnt{font:10.5px var(--mono);color:var(--muted);background:var(--field-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap}
.head-note{margin-left:auto;font-size:10.5px;color:var(--muted);white-space:nowrap}
.view{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 18px}
.view:focus{outline:none}

/* ========== 文字视图 ========== */
.group{margin-bottom:14px}
.group-head{display:flex;align-items:center;gap:7px;height:22px;margin-bottom:6px;padding:0 2px}
.group-head h3{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--tone);margin:0}
.group-head .n{font:10px var(--mono);color:var(--muted)}
.group-head .hr{flex:1;height:1px;background:var(--line)}
.group-head .en{font:9.5px var(--mono);letter-spacing:.1em;color:var(--dim)}
.req{
  border:1px solid var(--card-line);border-radius:var(--r-card);background:var(--card);
  margin-bottom:6px;overflow:hidden;box-shadow:0 1px 1px rgba(40,20,30,.03);
}
.req.warn{border-color:var(--warn-line)}
.req.warn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--warn)}
.req{position:relative}
.req.is-open{box-shadow:0 6px 18px -12px rgba(40,20,30,.4),inset 0 0 0 .5px rgba(232,96,143,.10)}
.req-head{display:flex;align-items:center;gap:10px;width:100%;padding:8px 11px;text-align:left;min-height:40px}
.req-head:hover{background:var(--row-hover)}
.req-idx{font:10.5px var(--mono);color:var(--dim);flex:0 0 18px}
.req.is-open .req-idx{color:var(--accent)}
.req-title{font-size:12.5px;font-weight:600;display:block;line-height:1.35}
.req-sub{font-size:10.5px;color:var(--muted);display:block;line-height:1.4;margin-top:1px;max-width:600px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.req-head > span:nth-child(2){min-width:0;flex:1}
.req-meta{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.proj-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;white-space:nowrap}
.proj-tag i{width:5px;height:5px;border-radius:50%;background:var(--pc)}
.prio{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 4px}
.prio.high{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.req-meta .seg{font-size:9.5px;color:var(--dim)}
.req-meta .tok{font:9.5px var(--mono);color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:1px 4px}
.req-chev{color:var(--dim);display:flex;transition:transform .16s}
.req.is-open .req-chev{transform:rotate(90deg);color:var(--accent)}
.req-body{display:none;padding:0 11px 11px}
.req.is-open .req-body{display:block}
.quote{border:1px solid var(--line);border-left:2px solid var(--accent-line);border-radius:0 6px 6px 0;background:var(--field-2);padding:7px 9px;margin-bottom:9px}
.quote .qk{display:flex;align-items:center;gap:8px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.quote .qk .sp{flex:1}
.quote .qk button{font-size:10px;color:var(--accent-2)}
.quote p{margin:0;font-size:12px;line-height:1.55;color:var(--ink-2)}
.quote p.extra{margin-top:5px;font-size:11px;color:var(--muted)}
.quote p.extra b{color:var(--ink-2);font-weight:600;margin-right:4px}
.blk{margin-bottom:9px}
.blk h4{margin:0 0 4px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.blk h4 .n{font:9.5px var(--mono);color:var(--dim);letter-spacing:0}
.flow{display:grid;grid-template-columns:76px 1fr;gap:2px 10px;margin-bottom:9px;font-size:11.5px}
.flow .fl{color:var(--muted);font-size:10.5px;padding-top:1px}
.flow p{margin:0;color:var(--ink-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:10.5px;line-height:16px;padding:1px 6px;border-radius:5px;
  border:1px solid var(--line);background:var(--field);color:var(--ink-2);max-width:100%;
}
.chip .fi{display:flex;color:var(--muted)}
.chip.acc{font-family:var(--mono);font-size:10px;background:var(--field-2)}
.chip.warn{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.chip.link{border-color:var(--accent-line);color:var(--accent-2);background:var(--accent-soft);cursor:pointer}
.chip.link:hover{border-color:var(--accent);background:var(--accent-soft)}
.chip.reuse{border-style:dashed}
.chip:hover{border-color:var(--line-2)}
.leaf-note{font-size:10.5px;color:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:2px 0 9px}
.seg-cell{border:1px solid var(--line);border-radius:6px;background:var(--field);padding:4px 6px;text-align:left;min-height:42px}
.seg-cell:hover{border-color:var(--accent-line)}
.seg-cell .k{display:block;font-size:9px;color:var(--muted);letter-spacing:.06em}
.seg-cell .v{display:block;font-size:10px;color:var(--ink-2);line-height:1.35;margin-top:2px;max-height:28px;overflow:hidden}
.seg-cell.empty .v{color:var(--dim);font-style:italic}
.req-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);padding-top:8px}
.rel{font-size:11px;display:flex;flex-direction:column;gap:3px}
.rel .line{display:flex;align-items:center;gap:6px;min-width:0}
.rel .k{color:var(--muted);font-size:10px;flex:0 0 auto;width:26px}
.rel button{font-size:11px;color:var(--accent-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.rel button:hover{text-decoration:underline}
.rel .node{color:var(--ink-2);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel .step{display:inline-flex;align-items:center;gap:5px}
.rel .step button{border:1px solid var(--line);border-radius:4px;width:18px;height:18px;display:grid;place-items:center;color:var(--ink-2);font-size:11px;padding:0}
.rel .step button:disabled{opacity:.35}
.rel .step .n{font:10px var(--mono);color:var(--muted)}
.req-actions{display:flex;align-items:center;gap:6px;padding-top:8px;margin-top:8px;border-top:1px solid var(--line)}
.btn-sm{height:21px;padding:0 8px;border-radius:5px;border:1px solid var(--line);background:var(--field);font-size:10.5px;color:var(--ink-2)}
.btn-sm:hover{background:var(--field-2);border-color:var(--line-2)}
.btn-sm.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
.btn-sm.primary:hover{background:var(--accent-2)}
[data-theme="night"] .btn-sm.primary{color:#1A0F14}
.btn-sm.danger{color:var(--warn)}
.req-actions .meta{margin-left:auto;font:9.5px var(--mono);color:var(--dim)}
.empty-state{padding:52px 12px;text-align:center;color:var(--muted);font-size:12px;line-height:1.9}

/* ========== 星图 ========== */
.view-star{position:relative;padding:0;overflow:hidden;background:
  radial-gradient(560px 380px at 22% 18%,rgba(232,96,143,.06),transparent 70%),
  radial-gradient(620px 420px at 82% 78%,rgba(124,92,214,.06),transparent 70%)}
[data-theme="night"] .view-star{background:
  radial-gradient(620px 420px at 22% 16%,rgba(255,111,165,.10),transparent 70%),
  radial-gradient(680px 460px at 84% 80%,rgba(124,92,214,.13),transparent 72%)}
.sky{position:absolute;inset:0;pointer-events:none;transition:transform .5s ease-out}
.speck{position:absolute;border-radius:50%;background:rgba(160,110,130,.55);animation:twinkle 6s ease-in-out infinite}
[data-theme="night"] .speck{background:rgba(255,220,235,.7)}
@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.6}}
.stars-lines,.link-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;color:rgba(160,110,130,.4)}
[data-theme="night"] .stars-lines,[data-theme="night"] .link-lines{color:rgba(255,210,230,.45)}
.link-lines{z-index:2}
#starStage{position:absolute;inset:0;z-index:3}
.cluster-label{
  position:absolute;z-index:1;font:9.5px var(--mono);letter-spacing:.15em;color:var(--dim);pointer-events:none;white-space:nowrap;
  text-transform:uppercase;
}
.cluster-label i{display:block;font:10.5px var(--sans);letter-spacing:0;color:var(--muted);text-transform:none;margin-top:1px}
.star{
  position:absolute;z-index:3;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;
  padding:2px 3px;border-radius:999px;
}
.star .core{width:var(--s);height:var(--s);border-radius:50%;background:var(--c);flex:0 0 auto;
  box-shadow:0 0 0 3px rgba(255,255,255,.35),0 0 10px 2px color-mix(in srgb,var(--c) 40%,transparent);opacity:.92}
[data-theme="night"] .star .core{box-shadow:0 0 0 3px rgba(0,0,0,.35),0 0 12px 3px color-mix(in srgb,var(--c) 55%,transparent)}
.star .lbl{
  font-size:10px;color:var(--ink-2);white-space:nowrap;background:rgba(255,255,255,.78);border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;max-width:158px;overflow:hidden;text-overflow:ellipsis;opacity:.92;
}
[data-theme="night"] .star .lbl{background:rgba(20,12,26,.8)}
.star.flip{flex-direction:row-reverse}
.star:hover .lbl{opacity:1;border-color:var(--accent-line);color:var(--ink)}
.star.is-sel .lbl{border-color:var(--accent);color:var(--accent-2);font-weight:600;background:var(--accent-soft)}
.star.is-sel .core{box-shadow:0 0 0 3px rgba(232,96,143,.22),0 0 16px 4px color-mix(in srgb,var(--c) 60%,transparent)}
.canvas-cap{position:absolute;left:14px;top:12px;z-index:4;font-size:10.5px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.canvas-cap b{color:var(--ink-2);font-weight:600;margin-right:5px}
.canvas-hint{position:absolute;left:14px;bottom:10px;z-index:4;font-size:10px;color:var(--dim)}
.preview{
  position:absolute;z-index:8;width:272px;border-radius:8px;border:1px solid var(--line-2);
  background:var(--card);box-shadow:var(--sh-pop);padding:9px 10px 8px;display:none;
}
.preview.on{display:block;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.99)}to{opacity:1;transform:none}}
.p-top{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--muted)}
.p-top .chip{font-size:9.5px;padding:0 5px}
.p-proj{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-close{margin-left:auto;width:16px;height:16px;border-radius:3px;color:var(--muted);font-size:13px;line-height:1}
.p-close:hover{background:var(--row-hover);color:var(--ink)}
.p-title{font-size:12.5px;margin:5px 0 3px;line-height:1.35}
.p-text{font-size:10.5px;color:var(--ink-2);margin:0 0 6px;line-height:1.5;max-height:54px;overflow:hidden}
.p-files{display:flex;flex-direction:column;gap:3px;margin-bottom:7px}
.p-file{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:2px 5px;text-align:left}
.p-file:hover{border-color:var(--accent-line);color:var(--accent-2)}
.p-file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-foot{display:flex;gap:5px;border-top:1px solid var(--line);padding-top:7px}

/* ========== 文件夹树 ========== */
.tree{font-size:12px}
.tnode{display:flex;align-items:center;gap:6px;height:28px;width:100%;padding:0 8px 0 calc(8px + var(--d) * 15px);border-radius:5px;text-align:left;color:var(--ink)}
.tnode:hover{background:var(--row-hover)}
.tnode .caret{display:flex;color:var(--dim);transition:transform .14s}
.tnode[aria-expanded="false"] .caret{transform:rotate(0deg)}
.tnode[aria-expanded="true"] .caret{transform:rotate(90deg)}
.tnode .caret{transform:rotate(90deg)}
.tnode[aria-expanded="false"] .caret{transform:none}
.tnode .sq{width:9px;height:9px;border-radius:2.5px;background:var(--pc,var(--dim));flex:0 0 9px;opacity:.9}
.tnode .tname{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode.cat .tname{font-weight:500;font-size:11.5px;color:var(--ink-2)}
.tnode .tc{margin-left:auto;font:10px var(--mono);color:var(--dim)}
.tleaf{
  display:flex;align-items:center;gap:7px;height:27px;width:100%;
  padding:0 8px 0 calc(8px + var(--d) * 15px);border-radius:5px;text-align:left;font-size:11.5px;color:var(--ink-2);
}
.tleaf:hover{background:var(--row-hover)}
.tleaf.is-sel{background:var(--accent);color:#fff;font-weight:600}
[data-theme="night"] .tleaf.is-sel{color:#1A0F14}
.tleaf .d{width:6px;height:6px;border-radius:50%;background:var(--tone);flex:0 0 6px}
.tleaf.is-sel .d{background:#fff}
[data-theme="night"] .tleaf.is-sel .d{background:#1A0F14}
.tleaf .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tleaf .tm{margin-left:auto;font-size:9.5px;color:var(--dim);white-space:nowrap}
.tleaf.is-sel .tm{color:rgba(255,255,255,.8)}
.tleaf .badge-new,.tnode .badge-new{font-size:8.5px;border:1px solid var(--ainew);color:var(--ainew);border-radius:3px;padding:0 3px;line-height:13px;flex:0 0 auto}

/* ========== 待确认区 ========== */
.confirm-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.confirm-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.01em}
.confirm-head p{margin:3px 0 0;font-size:11px;color:var(--muted);line-height:1.5;max-width:560px}
.confirm-head .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.cf{
  border:1px solid var(--card-line);border-radius:var(--r-card);background:var(--card);margin-bottom:7px;
  display:grid;grid-template-columns:1fr 148px;gap:0;overflow:hidden;
}
.cf-main{padding:10px 12px;min-width:0}
.cf-top{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted);flex-wrap:wrap}
.cf-top .node{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:520px}
.conf{font-size:9.5px;border-radius:4px;padding:0 5px;line-height:15px;border:1px solid var(--line);color:var(--muted)}
.conf.high{color:var(--done);border-color:rgba(30,158,116,.35);background:var(--ok-bg)}
.conf.mid{color:var(--idea);border-color:rgba(201,138,36,.35);background:rgba(201,138,36,.08)}
.cf h3{margin:5px 0 3px;font-size:13px;font-weight:600;line-height:1.3}
.cf .ev{margin:0 0 7px;font-size:10.5px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cf-2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-bottom:7px}
.cf-2 p{margin:0;font-size:11px;line-height:1.5;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cf-2 p b{font-weight:600;color:var(--muted);font-size:9.5px;letter-spacing:.06em;margin-right:5px}
.cf .chips{margin-bottom:6px}
.cf .chips:last-child{margin-bottom:0}
.cf .fold{align-self:flex-start;font-size:10px;color:var(--accent-2);border-bottom:1px dashed var(--accent-line);margin-bottom:6px}
.cf .quote{margin:6px 0 0;font-size:11px}
.cf-acts{border-left:1px solid var(--line);padding:9px 10px;display:flex;flex-direction:column;gap:5px;background:var(--field-2)}
.cf-acts .btn-sm{width:100%;justify-content:center;display:flex;height:23px;font-size:11px}
.cf-acts .lbl{font-size:9px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:auto}

/* ========== 底部输入 ========== */
.composer{flex:0 0 auto;padding:7px 12px 8px;border-top:1px solid var(--line);background:var(--chrome)}
.clip-suggest{display:flex;align-items:center;gap:8px;height:20px;font-size:10px;color:var(--muted);margin-bottom:4px}
.clip-suggest .cl{color:var(--accent-2);font-weight:600}
.clip-suggest .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip-suggest button{font-size:10px;color:var(--accent-2)}
.clip-suggest button:hover{text-decoration:underline}
.composer-box{border:1px solid var(--line);border-radius:7px;background:var(--field);padding:5px 7px;transition:border-color .15s,box-shadow .15s}
.composer-box.is-focus{border-color:var(--accent-line);box-shadow:0 0 0 3px rgba(232,96,143,.12)}
.composer-row{display:flex;align-items:center;gap:7px}
.composer-plus{color:var(--accent);display:flex;opacity:.9}
.composer-row input{border:0;outline:none;background:none;flex:1;font-size:12.5px;color:var(--ink);height:20px}
.composer-row input::placeholder{color:var(--muted)}
.composer-meta{display:flex;align-items:center;gap:6px;margin-top:3px;padding-left:21px}
.composer-meta select{height:18px;font-size:10px;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;background:var(--field);padding:0 3px;outline:none}
.composer-chip{font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:16px}
.composer-chip:hover{color:var(--accent-2);border-color:var(--accent-line)}
.composer-chip[aria-pressed="true"]{color:var(--accent-2);border-color:var(--accent-line);background:var(--accent-soft)}
.composer-meta .hint{margin-left:auto;font-size:9.5px;color:var(--dim);white-space:nowrap}
.composer-segs{display:none;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:5px;padding-top:5px;border-top:1px solid var(--line)}
.composer-box.segs-open .composer-segs{display:grid}
.composer-segs label{display:block;font-size:9px;color:var(--muted);margin-bottom:2px}
.composer-segs input{width:100%;height:20px;border:1px solid var(--line);border-radius:4px;background:var(--field);padding:0 5px;font-size:10.5px;outline:none;color:var(--ink)}
.composer-segs input:focus{border-color:var(--accent-line)}

/* ========== 状态栏 ========== */
.statusbar{
  height:26px;flex:0 0 26px;display:flex;align-items:center;gap:2px;padding:0 9px;
  border-top:1px solid var(--line);background:var(--chrome);font-size:10.5px;color:var(--muted);z-index:10;
}
.status-tools{display:flex;align-items:center;gap:1px;min-width:0;overflow:hidden}
.statusbar .tool{display:flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:3px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.statusbar .tool:hover{background:var(--row-hover);color:var(--ink)}
.gen{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.gen .hint{font-size:10px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.gen .btn-primary{height:19px;padding:0 8px;font-size:10.5px}

/* ========== Sheet ========== */
.sheet-mask{position:absolute;left:0;right:0;top:46px;bottom:0;background:rgba(28,16,24,.18);z-index:30;animation:fadeIn .16s}
[data-theme="night"] .sheet-mask{background:rgba(0,0,0,.38)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  position:absolute;left:50%;top:46px;transform:translateX(-50%);z-index:31;width:820px;
  max-height:calc(100% - 46px - 10px);display:flex;flex-direction:column;
  background:var(--sheet);border-radius:0 0 var(--r-win) var(--r-win);
  border:1px solid var(--line-2);border-top:0;box-shadow:0 22px 50px -16px rgba(30,12,22,.5);
  animation:sheetIn .18s ease-out;
}
@keyframes sheetIn{from{transform:translate(-50%,-10px);opacity:.6}to{transform:translateX(-50%);opacity:1}}
.sheet.wide{width:880px}
.sheet.mid{width:700px}
.sheet.narrow{width:600px}
.sh-head{flex:0 0 auto;padding:12px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.sh-head h2{margin:0;font-size:14px;font-weight:700}
.sh-head p{margin:2px 0 0;font-size:10.5px;color:var(--muted);line-height:1.45}
.sh-head .sh-x{margin-left:auto;width:20px;height:20px;border-radius:5px;color:var(--muted);font-size:15px;line-height:1;display:grid;place-items:center}
.sh-head .sh-x:hover{background:var(--row-hover);color:var(--ink)}
.sh-body{flex:1;min-height:0;overflow-y:auto;padding:12px 16px}
.sh-foot{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 16px;border-top:1px solid var(--line);background:var(--field-2)}
.sh-foot .tip{font-size:10px;color:var(--dim)}
.sh-foot .spacer{flex:1}
.sh-foot .btn,.sh-foot .btn-primary{height:26px;font-size:12px;padding:0 12px}
.field{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:6px 8px;font-size:12px;outline:none;color:var(--ink)}
.field:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px rgba(232,96,143,.12)}
textarea.field{resize:vertical;line-height:1.5}
.form-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.form-row label{font-size:11px;color:var(--muted);flex:0 0 62px}
.form-row .field{flex:1}
select.field{height:26px;padding:0 6px}
.mono-box{font:11px/1.6 var(--mono);white-space:pre-wrap;background:var(--field-2);border:1px solid var(--line);border-radius:6px;padding:9px 10px;max-height:340px;overflow:auto;color:var(--ink-2)}
.note-sec{margin-bottom:14px}
.note-sec h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2);margin:0 0 6px;display:flex;align-items:center;gap:6px}
.note-sec h3 .n{font:9.5px var(--mono);color:var(--dim)}
.note-sec p{margin:0 0 6px;font-size:11.5px;color:var(--ink-2);line-height:1.6}
.note-list{display:flex;flex-direction:column;gap:4px}
.note-list .note{display:grid;grid-template-columns:118px 1fr;gap:8px;font-size:11px;line-height:1.5;padding:3px 0;border-bottom:1px dotted var(--line)}
.note-list .note .rk{color:var(--muted);font-size:10px}
.note-list .note .rv{color:var(--ink-2)}
.check{width:100%;border-collapse:collapse;font-size:10.5px}
.check th,.check td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.check th{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.check td.ok{color:var(--done);width:18px;font-weight:700}
.check tr:hover td{background:var(--row-hover)}
.itable{width:100%;border-collapse:collapse;font-size:10.5px;margin:4px 0 6px}
.itable th,.itable td{border-bottom:1px solid var(--line);padding:3px 5px;text-align:left;vertical-align:top}
.itable th{color:var(--muted);font-weight:600;font-size:9.5px;letter-spacing:.05em}

/* ========== 录入 Sheet ========== */
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:0;font-size:10.5px;color:var(--ink-2);border:1px solid var(--line);border-radius:6px;background:var(--field-2);padding:5px 9px;margin-bottom:9px}
.stats b{font-weight:600;color:var(--ink)}
.stats .sep{color:var(--dim);margin:0 6px}
.intake-split{display:grid;grid-template-columns:300px 1fr;gap:10px;align-items:start}
.raw{border:1px solid var(--line);border-radius:6px;background:var(--field);padding:8px;max-height:452px;overflow-y:auto}
.raw .raw-h{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.raw .raw-h .hint{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--dim);font-size:9.5px}
.raw p{margin:0 0 6px;font-size:10.5px;line-height:1.55;color:var(--ink-2)}
.raw .h1{font-size:12px;font-weight:700;color:var(--ink);margin:2px 0 6px;display:flex;gap:6px;align-items:flex-start}
.raw .h2{font-size:11px;font-weight:600;color:var(--ink);margin:6px 0 3px;display:flex;gap:5px;align-items:flex-start;flex-wrap:wrap}
.tag{font:8.5px/13px var(--sans);letter-spacing:.04em;border:1px solid var(--line);border-radius:3px;padding:0 3px;color:var(--muted);flex:0 0 auto;margin-top:1px}
.tag.h1t{color:var(--accent-2);border-color:var(--accent-line)}
.tag.h2t{color:var(--ainew);border-color:rgba(59,125,216,.35)}
.tag.tbt{color:var(--done);border-color:rgba(30,158,116,.35)}
.tag.codet{color:var(--promoted);border-color:rgba(124,92,214,.35)}
.raw pre{margin:2px 0 6px;padding:5px 6px;border-radius:4px;background:var(--field-2);border:1px solid var(--line);font:9.5px/1.5 var(--mono);color:var(--ink-2);white-space:pre-wrap;overflow-x:auto}
.icards{display:flex;flex-direction:column;gap:6px;max-height:452px;overflow-y:auto;padding-right:2px}
.icard{border:1px solid var(--card-line);border-radius:7px;background:var(--card);padding:7px 9px}
.icard.ignored{opacity:.45}
.icard-top{display:flex;align-items:center;gap:6px}
.icard-top h4{margin:0;font-size:12px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icard-top select{height:19px;font-size:10px;border:1px solid var(--line);border-radius:4px;background:var(--field);padding:0 3px;outline:none}
.icard .ig{font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:15px}
.icard .ig:hover{color:var(--warn);border-color:var(--warn-line)}
.icard .meta-line{display:flex;align-items:flex-start;gap:4px;font-size:9.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.icard .meta-line b{color:var(--ink-2);font-weight:500;flex:0 0 auto}
.icard .meta-line .pth{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icard .chips{gap:4px;margin-top:4px}
.icard .chip{font-size:9px;line-height:14px;padding:0 4px}
.icard .ev{font-size:9.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.icard .segs-row{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:9.5px;color:var(--muted)}
.segs-toggle{font-size:9.5px;color:var(--accent-2);border:1px solid var(--accent-line);border-radius:4px;padding:0 5px;line-height:15px}
.segs-detail{display:none;grid-template-columns:1fr 1fr;gap:2px 8px;margin-top:4px;padding-top:4px;border-top:1px dotted var(--line)}
.icard.open .segs-detail{display:grid}
.segs-detail div{font-size:9px;line-height:1.4;color:var(--muted)}
.segs-detail div b{color:var(--ink-2);font-weight:500;margin-right:3px}
.icard .files-row .chip.verify{color:var(--idea);border-color:rgba(201,138,36,.45);background:rgba(201,138,36,.1)}
.res{text-align:center;padding:18px 10px 8px}
.res .big{font-size:15px;font-weight:700;margin-bottom:6px}
.res .line{font-size:11.5px;color:var(--ink-2);line-height:1.9}
.res .line b{font-weight:600;color:var(--ink)}
.res .path{font:10.5px var(--mono);color:var(--muted);margin-top:8px}
.res .nv{display:inline-flex;align-items:center;gap:6px;margin:10px 0 2px;font-size:11px;color:var(--done)}
.tree-pick{border:1px solid var(--line);border-radius:6px;max-height:210px;overflow-y:auto;background:var(--field)}
.tree-pick .row{height:26px;font-size:11.5px;padding:0 8px 0 calc(8px + var(--d) * 14px)}
.tree-pick .row .dot{background:var(--dim)}
.tree-pick .row.sel .dot{background:#fff}
.newline{display:flex;gap:6px;margin-top:7px}
.newline .field{flex:1;height:26px}
.newline .btn{height:26px}

/* ========== 右键菜单 ========== */
.ctx{
  position:absolute;z-index:60;min-width:188px;padding:4px;border-radius:7px;background:var(--sheet);
  border:1px solid var(--line-2);box-shadow:var(--sh-pop);
}
.ctx button{display:flex;align-items:center;gap:8px;width:100%;height:24px;padding:0 8px;border-radius:5px;font-size:12px;text-align:left;color:var(--ink)}
.ctx button:hover{background:var(--accent);color:#fff}
[data-theme="night"] .ctx button:hover{color:#1A0F14}
.ctx .msep{height:1px;background:var(--line);margin:4px 6px}
.ctx .danger{color:var(--warn)}

/* ========== HUD ========== */
.hud{
  position:absolute;left:50%;top:9px;transform:translate(-50%,-6px);z-index:80;
  background:rgba(30,24,27,.9);color:#fff;font-size:11.5px;line-height:1;border-radius:12px;padding:7px 14px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;white-space:nowrap;
  box-shadow:0 8px 22px -8px rgba(0,0,0,.55);
}
.hud.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<script>
/* ============================================================
   提词器 · 客户端 v2 · 静态演示（原生 JS，无框架）
   数据贴近 proposal / requirement，可换真实后端
   ============================================================ */

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = n => String(n).padStart(2, "0");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const iconFile = () => '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3.5h7l5 5V20a1 1 0 01-1 1H7a1 1 0 01-1-1V4.5a1 1 0 011-1z"/><path d="M13 3.5V9h5"/></svg>';
const iconChev = () => '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

/* ---------- 常量 ---------- */
const STATUS = {
  todo:      { label: "待办",   en: "TODO",     color: "var(--todo)" },
  idea:      { label: "想法",   en: "IDEA",     color: "var(--idea)" },
  done_user: { label: "已完成", en: "DONE",     color: "var(--done)" },
  done_ai:   { label: "AI转正", en: "PROMOTED", color: "var(--promoted)" },
  ai_done:   { label: "AI新增", en: "AI NEW",   color: "var(--ainew)" },
  invalid:   { label: "已失效", en: "VOID",     color: "var(--void)" }
};
const STATUS_ORDER = ["todo", "idea", "done_user", "done_ai", "ai_done", "invalid"];
const SEG_KEYS = ["应用场景", "背景", "前端", "后端", "数据来源", "前端排版"];
const PRIO_LABEL = { high: "高", mid: "中", low: "低" };

const PROJECTS = {
  ticiqi:    { label: "提词器",   en: "TICIQI",    note: "需求库",     color: "#E8608F", labelAt: [47, 24] },
  workbuddy: { label: "workbuddy", en: "WORKBUDDY", note: "长期记忆",   color: "#F0B45A", labelAt: [18, 9] },
  xuhbot:    { label: "虚幻",     en: "XUHBOT",    note: "机器人",     color: "#35B58C", labelAt: [86, 7] },
  cmd:       { label: "命令方块", en: "COMMAND",   note: "文件工作台", color: "#6F9BFF", labelAt: [22, 92] },
  search:    { label: "search",   en: "SEARCH",    note: "检索",       color: "#9B7BFF", labelAt: [88, 72] },
  spend:     { label: "两个消耗", en: "SPEND",     note: "用量",       color: "#FF8A9B", labelAt: [62, 93] },
  other:     { label: "其它",     en: "OTHER",     note: "未归类",     color: "#A6949C", labelAt: [89, 34] }
};
const PROJ_ORDER = ["ticiqi", "workbuddy", "xuhbot", "cmd", "search", "spend", "other"];
const projLabel = p => (PROJECTS[p] ? PROJECTS[p].label : p);

/* ---------- 录入原文：一份数据同时供文本框与分块渲染 ---------- */
const FIELDS = [
  ["真名", "本人自报、你面板", "「我叫X」「叫我X」"],
  ["QQ 昵称", "资料卡", "他说话且昵称变了"],
  ["群名片", "事件里的 card", "他说话且名片变了"],
  ["B站昵称", "B站事件 / 加账号时拉一次", "变了才写"],
  ["性别", "默认男猜 / 本人自述 / 面板", "「我是女的」"],

/* ---------- 星图 ---------- */
function drawTreeLines(list) {
  const groups = {};
  list.forEach(it => (groups[it.project] = groups[it.project] || []).push(it));
  let svg = "";
  Object.values(groups).forEach(arr => {
    const sorted = arr.slice().sort((a, b) => (a.sy - b.sy) || (a.sx - b.sx));
    for (let i = 1; i < sorted.length; i++) {
      let best = 0, bd = Infinity;
      for (let j = 0; j < i; j++) {
        const d = Math.pow(sorted[i].sx - sorted[j].sx, 2) + Math.pow(sorted[i].sy - sorted[j].sy, 2);
        if (d < bd) { bd = d; best = j; }
      }
      svg += '<line x1="' + sorted[best].sx + '" y1="' + sorted[best].sy + '" x2="' + sorted[i].sx + '" y2="' + sorted[i].sy +
        '" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4" vector-effect="non-scaling-stroke" opacity=".45"/>';
    }
  });
  $("#starLines").innerHTML = svg;
}
function drawLinkLines(list) {
  const seenPair = new Set();
  let svg = "";
  list.forEach(it => {
    (it.links || []).forEach(s => {
      const id = linkTarget(s);
      if (!id) return;
      const tgt = list.find(x => x.id === id);
      if (!tgt) return;
      const key = [it.id, tgt.id].sort().join("|");
      if (seenPair.has(key)) return;
      seenPair.add(key);
      svg += '<line x1="' + it.sx + '" y1="' + it.sy + '" x2="' + tgt.sx + '" y2="' + tgt.sy +
        '" stroke="currentColor" stroke-width="1" stroke-dasharray="1.5 3" vector-effect="non-scaling-stroke" opacity=".75"/>';
    });
  });
  $("#linkLines").innerHTML = svg;
}
function renderStars() {
  const list = visible();
  const stage = $("#starStage");
  stage.innerHTML = "";
  drawTreeLines(list);
  drawLinkLines(list);
  list.forEach(it => {
    const size = it.prio === "high" ? 7 : it.prio === "mid" ? 5.6 : 4.6;
    const btn = document.createElement("button");
    btn.className = "star" + (it.sx > 62 ? " flip" : "") + (it.id === state.selectedId ? " is-sel" : "");
    btn.dataset.id = it.id;
    btn.style.left = it.sx + "%";
    btn.style.top = it.sy + "%";
    btn.style.setProperty("--s", size + "px");
    btn.style.setProperty("--c", STATUS[it.status].color);
    btn.setAttribute("aria-label", it.title);
    btn.innerHTML = '<span class="core"></span><span class="lbl">' + esc(it.title) + '</span>';
    let moved = false, sx0 = 0, sy0 = 0, ox = 0, oy = 0, rect = null;
    btn.addEventListener("pointerdown", e => {
      if (e.button !== 0) return;
      rect = $("#starView").getBoundingClientRect();
      sx0 = e.clientX; sy0 = e.clientY; ox = it.sx; oy = it.sy; moved = false;
      try { btn.setPointerCapture(e.pointerId); } catch (_) {}
      const onMove = ev => {
        const dx = (ev.clientX - sx0) / rect.width * 100;
        const dy = (ev.clientY - sy0) / rect.height * 100;
        if (Math.abs(ev.clientX - sx0) + Math.abs(ev.clientY - sy0) > 4) moved = true;
        it.sx = clamp(ox + dx, 5, 95);
        it.sy = clamp(oy + dy, 8, 92);
        btn.style.left = it.sx + "%"; btn.style.top = it.sy + "%";
        btn.classList.toggle("flip", it.sx > 62);
        drawTreeLines(visible()); drawLinkLines(visible());
        positionPreview();
      };
      const onUp = () => {
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        try { btn.releasePointerCapture(e.pointerId); } catch (_) {}
      };
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
    });
    btn.addEventListener("click", () => { if (moved) { moved = false; return; } selectStar(it.id); });
    btn.addEventListener("contextmenu", e => { e.preventDefault(); openCtx(it.id, e.clientX, e.clientY); });
    stage.appendChild(btn);
  });
  $("#clusterLabels").innerHTML = PROJ_ORDER.filter(p => list.some(it => it.project === p)).map(p => {
    const cfg = PROJECTS[p];
    return '<span class="cluster-label" style="left:' + cfg.labelAt[0] + '%;top:' + cfg.labelAt[1] + '%">' + cfg.en + '<i>' + cfg.note + '</i></span>';
  }).join("");
  positionPreview();
}

function positionPreview() {
  const p = $("#preview");
  if (!p.classList.contains("on")) return;
  const canvas = $("#starView");
  const star = canvas.querySelector('.star[data-id="' + state.selectedId + '"]');
  if (!star) return;
  const cr = canvas.getBoundingClientRect(), sr = star.getBoundingClientRect();
  const lbl = star.querySelector(".lbl"), lr = lbl ? lbl.getBoundingClientRect() : sr;
  const w = p.offsetWidth, h = p.offsetHeight;
  const others = [];
  canvas.querySelectorAll(".star:not(.is-sel) .lbl").forEach(l => {
    const r = l.getBoundingClientRect();
    others.push({ l: r.left - cr.left, t: r.top - cr.top, r: r.right - cr.left, b: r.bottom - cr.top });
  });
  const rightX = lr.right - cr.left + 12, leftX = lr.left - cr.left - w - 12;
  const topY = sr.top - cr.top - 26, farTopY = sr.top - cr.top - h - 12;
  const cands = [
    { l: rightX, t: topY }, { l: leftX, t: topY },
    { l: rightX, t: sr.bottom - cr.top - 8 }, { l: leftX, t: sr.bottom - cr.top - 8 },
    { l: rightX, t: farTopY }, { l: leftX, t: farTopY }
  ];
  let best = null, bestScore = Infinity;
  cands.forEach(c => {
    const L = clamp(c.l, 10, cr.width - w - 10), T = clamp(c.t, 10, cr.height - h - 10);
    let score = 0;
    others.forEach(o => {
      const ox = Math.max(0, Math.min(L + w, o.r) - Math.max(L, o.l));
      const oy = Math.max(0, Math.min(T + h, o.b) - Math.max(T, o.t));
      score += ox * oy;
    });
    score += Math.abs(L - c.l) * 60 + Math.abs(T - c.t) * 60;
    if (score < bestScore) { bestScore = score; best = { L, T }; }
  });
  p.style.left = best.L + "px";
  p.style.top = best.T + "px";
}

/* ---------- 文件夹视图 ---------- */
function treeFor(list) {
  const roots = [];
  PROJ_ORDER.forEach(p => {
    const items = list.filter(i => i.project === p);
    if (!items.length) return;
    const root = { label: PROJECTS[p].label, color: PROJECTS[p].color, key: "p:" + p, children: [], leaves: [], count: items.length, depth: 0 };
    items.forEach(it => {
      const groups = it.groups && it.groups.length ? it.groups : [it.cat];
      let cur = root;
      groups.forEach((g, gi) => {
        const key = root.key + "/" + groups.slice(0, gi + 1).join("/");
        let node = cur.children.find(c => c.label === g);
        if (!node) {
          node = { label: g, key, children: [], leaves: [], count: 0, depth: gi + 1, isNew: false };
          cur.children.push(node);
        }
        node.count++;
        if (it.isNew && gi === groups.length - 1) node.isNew = true;
        cur = node;
      });
      cur.leaves.push(it);
    });
    roots.push(root);
  });
  return roots;
}

  const walk = (node, depth) => {

    if (depth === 0) {
      html += '<button class="tnode" data-node="' + esc(node.key) + '" aria-expanded="' + !collapsed + '" style="--d:0;--pc:' + node.color + '">' +
        '<span class="caret">' + iconChev() + '</span><span class="sq"></span><span class="tname">' + esc(node.label) + '</span>' +
        '<span class="tc">' + node.count + '</span></button>';
    } else {
      html += '<button class="tnode cat" data-node="' + esc(node.key) + '" aria-expanded="' + !collapsed + '" style="--d:' + depth + '">' +
        '<span class="caret">' + iconChev() + '</span><span class="tname">' + esc(node.label) + '</span>' + newBadge +
        '<span class="tc">' + node.count + '</span></button>';
    }
    if (collapsed) return;
    node.children.forEach(c => walk(c, depth + 1));
    node.leaves.forEach(it => {
      html += '<button class="tleaf' + (it.id === state.selectedId ? " is-sel" : "") + '" data-open="' + it.id + '" style="--d:' + (depth + 1) + ';--tone:' + STATUS[it.status].color + '">' +
        '<span class="d"></span><span class="tt">' + esc(it.title) + '</span>' + (it.isNew ? '<span class="badge-new">新</span>' : "") +
        '<span class="tm">' + STATUS[it.status].label + (it.token > 7000 ? " · " + (it.token / 1000).toFixed(1) + "k" : "") + '</span></button>';
    });
  };
  roots.forEach(r => walk(r, 0));
  wrap.innerHTML = html + '</div>';
}

function applyTheme(mode) {
  state.appearance = mode || "system";
  const dark = mode === "dark" || (mode !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "night" : "day");
}
function switchView(v) {
  state.view = v;
  $("#starView").hidden = v !== "star";
  $("#textView").hidden = v !== "text";
  $("#folderView").hidden = v !== "folder";
  $("#confirmView").hidden = v !== "confirm";
  $$("#viewSwitch button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === v)));
  hidePreview();
  if (v === "text") renderText(true);
  if (v === "star") renderStars();
  if (v === "folder") renderFolder();
  if (v === "confirm") renderConfirm();
  renderHead();
}
function renderAll(keep) {
  renderStatusRows();
  renderPendingRows();
  renderProjectRows();
  renderComposerProject();
  renderClip();
  renderHead();
  if (state.view === "text") renderText(!!keep);
  else if (state.view === "star") renderStars();
  else if (state.view === "folder") renderFolder();
  else if (state.view === "confirm") renderConfirm();
}

function nodePaths() {
  const set = new Set();
  DATA.forEach(it => {
    const parts = String(it.nodePath || "").split(" / ");

  return Array.from(set);
}

function saveComposer() {
  const input = $("#composerInput");
  const raw = input.value.trim();
  if (!raw) { input.focus(); return; }
  const parts = [raw];   // 底部只记一条；批量原始内容走「录入原始内容」流程
  const proj = state.composerProj;
  const now = Date.now();
  parts.forEach((text, i) => {
    DATA.push({
      id: "r" + (now + i), title: text.length > 16 ? text.slice(0, 16) : text,
      project: proj, cat: "未归类", nodePath: projLabel(proj) + " / 未归类", groups: [projLabel(proj), "未归类"],
      status: "todo", prio: "mid", parentId: null, updated: "刚刚", viewed: false,
      sx: 30 + Math.random() * 40, sy: 30 + Math.random() * 40,
      token: Math.round(text.length / 1.5), text, files: [], acceptance: [], links: [], reuse: [],
      confidence: "高", evidence: "你写的原话，按底部输入记下。", segs: {}
    });
  });
  input.value = "";
  const segs = {};
  $$("#composerSegs [data-cseg]").forEach(el => { if (el.value.trim()) segs[el.dataset.cseg] = el.value.trim(); });
  if (Object.keys(segs).length) {
    const last = DATA[DATA.length - 1];
    last.segs = segs;
    $$("#composerSegs [data-cseg]").forEach(el => (el.value = ""));
  }
  state.status = "all";
  state.projects.clear();
  state.q = "";
  $("#q").value = "";
  state.selectedId = DATA[DATA.length - 1].id;
  state.expandedId = state.selectedId;
  switchView("text");
  renderAll();
  hud("已记下 1 条 · 进待办（要批量归类点「录入原始内容」）");
}

/* ============================================================
   事件绑定
   ============================================================ */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-sheet-close],[data-intake-next],[data-intake-back],[data-intake-commit],[data-go-confirm],[data-ignore],[data-segs],[data-icard],[data-confirm],[data-relocate],[data-wrong],[data-confirm-all],[data-edit],[data-copy],[data-act],[data-go],[data-sib],[data-link],[data-file],[data-ctx],[data-ctx-act],[data-pick],[data-relocate-save],[data-wrong-save],[data-segs-save],[data-src],[data-arch],[data-new-proj],[data-copy-gen],[data-copy-rules],[data-mb-act],[data-theme-mode],[data-view],[data-status],[data-project],[data-pending],[data-pending-more],[data-node],[data-open],[data-toggle],[data-pclose],[data-expand],[data-light],[data-mb]");
  if (!t) return;
  const d = t.dataset;
  if (t.id === "confirmAll") return doConfirmAll();
  if (d.sheetClose !== undefined || t.hasAttribute("data-sheet-close")) return closeSheet();
  if (t.hasAttribute("data-intake-next")) {
    state.intakeText = $("#intakeRaw") ? $("#intakeRaw").value : state.intakeText;
    state.intakeStep = 2; return renderIntake();
  }
  if (t.hasAttribute("data-intake-back")) { state.intakeStep = 1; return renderIntake(); }
  if (t.hasAttribute("data-intake-commit")) {
    const n = commitIntakeSilent();
    state.intakeStep = 3;
    renderIntake(); renderAll();
    hud(n ? "已记下 " + n + " 条 · 进入待确认区" : "没有要写入的条目");
    return;
  }
  if (t.hasAttribute("data-go-confirm")) { closeSheet(); switchView("confirm"); return; }
  if (d.ignore) {
    if (state.intakeIgnored.has(d.ignore)) state.intakeIgnored.delete(d.ignore);
    else state.intakeIgnored.add(d.ignore);
    state.intakeStep = 2; return renderIntake();
  }
  if (d.segs) { const card = t.closest(".icard"); if (card) card.classList.toggle("open"); return; }
  if (d.confirm) return doConfirm(d.confirm);
  if (d.relocate) return openRelocate(d.relocate);
  if (d.wrong) return openWrong(d.wrong);
  if (d.edit) return openSegs(d.edit);
  if (d.copy) { const it = byId(d.copy); if (it) copyText(it.text, "原文"); return; }
  if (d.file !== undefined) { const p = d.file; if (p) hud("打开文件：" + p); return; }
  if (d.link) {
    const id = linkTarget(d.link);
    if (id && byId(id)) openInText(id); else hud("外部联动：" + d.link);
    return;
  }
  if (d.go) return openInText(d.go);
  if (d.sib) {
    const it = byId(state.selectedId);
    const sibs = groupSiblings(it);
    const idx = sibs.findIndex(x => x.id === it.id);
    const nx = d.sib === "prev" ? sibs[idx - 1] : sibs[idx + 1];
    if (nx) openInText(nx.id);
    return;
  }
  if (d.act) {
    const id = state.selectedId;
    const it = byId(id);
    if (!it) return;
    if (d.act === "complete") return setStatus(id, "done_user", "已完成 · 已转入「已完成」");
    if (d.act === "promote") return setStatus(id, "done_ai", "已确认转正 · 归入 AI转正");
    if (d.act === "reopen") return setStatus(id, "todo", "已重开 · 回到待办");
    if (d.act === "restore") return setStatus(id, "todo", "已恢复到待办");
    if (d.act === "wrong") return openWrong(id);
    if (d.act === "archive") return setStatus(id, "invalid", "已归档 · 原条目进入已失效");
    if (d.act === "delete") {
      const i = DATA.findIndex(x => x.id === id);
      if (i >= 0) DATA.splice(i, 1);
      renderAll(true);
      hud("已永久删除 1 条失效记录");
      return;
    }
  }
  if (d.ctx) { e.preventDefault(); return openCtx(d.ctx, e.clientX, e.clientY); }
  if (d.ctxAct) {
    const id = d.id, it = byId(id);
    $("#ctx").hidden = true;
    if (!it) return;
    if (d.ctxAct === "file") { hud("打开文件：" + ((it.files[0] || {}).p || "（无关联文件）")); return; }
    if (d.ctxAct === "copy") return copyText(it.text, "原文");
    if (d.ctxAct === "relocate") return openRelocate(id);
    if (d.ctxAct === "wrong") return openWrong(id);
    if (d.ctxAct === "archive") return setStatus(id, "invalid", "已归档 · 进入已失效");
    if (d.ctxAct === "delete") {
      const i = DATA.findIndex(x => x.id === id);
      if (i >= 0) DATA.splice(i, 1);
      renderAll(true); hud("已永久删除"); return;
    }
    if (d.ctxAct === "expand") return openInText(id);
    return;
  }
  if (d.pick) { $$("#pickList .row").forEach(r => r.classList.toggle("sel", r === t)); return; }
  if (d.relocateSave) {
    const it = byId(d.relocateSave);
    const pick = $("#pickList .row.sel");
    const custom = $("#pickNew").value.trim();
    const path = custom || (pick ? pick.dataset.pick : "");
    if (!path) { hud("先选一个节点或新建"); return; }
    it.nodePath = path;
    it.groups = path.split(" / ");
    closeSheet(); renderAll(true);
    hud("已改归属 · " + path.split(" / ").pop());
    return;
  }
  if (d.wrongSave) return doWrongSave(d.wrongSave);
  if (d.segsSave) {
    const it = byId(d.segsSave);
    $$("#sheet [data-seg]").forEach(el => { it.segs[el.dataset.seg] = el.value.trim(); });
    closeSheet(); renderAll(true); hud("六段已更新");
    return;
  }
  if (d.src) {
    if (d.src === "clip") {
      state.intakeText = state.clip || state.intakeText;
      state.intakeSource = "剪贴板 · 1 条";
      if ($("#intakeRaw")) $("#intakeRaw").value = state.intakeText;
      hud("已从剪贴板填入");
    } else if (d.src === "file") {
      state.intakeSource = "文件：测试/fixtures/录入-虚幻全流程.txt";
      hud("演示稿：已选择文件（真实接入时为系统文件选择框）");
    } else { hud("演示稿：粘贴板读取已在第 1 步文本框里"); }
    return;
  }
  if (d.newProj !== undefined) {
    const v = $("#newProj").value.trim();
    if (!v) { hud("先写项目名"); return; }
    const id = "p" + Object.keys(PROJECTS).length + Date.now();
    PROJECTS[id] = { label: v, en: "PROJECT", note: "新项目", color: "#6F9BFF", labelAt: [30, 30] };
    PROJ_ORDER.push(id);
    openProjects(); renderAll(true); hud("已新建项目 · " + v);
    return;
  }
  if (d.arch) {
    const p = d.arch;
    PROJECTS[p].archived = !PROJECTS[p].archived;
    openProjects(); renderAll(true); hud(PROJECTS[p].archived ? "已归档项目" : "已恢复项目");
    return;
  }
  if (d.copyGen !== undefined) return copyText($("#genBox").textContent, "本轮需求");
  if (d.copyRules !== undefined) return copyText($("#sheet .mono-box").textContent, "接入规则");
  if (d.mbAct) return doMenu(d.mbAct);
  if (d.themeMode) { applyTheme(d.themeMode); $("#mbMenu").hidden = true; hud("外观：" + ({"system":"跟随系统","light":"浅色","dark":"深色"}[d.themeMode])); return; }
  if (d.view) { state.status = "all"; return switchView(d.view); }
  if (d.status) { state.status = d.status; if (state.view === "confirm") switchView("text"); return renderAll(); }
  if (d.project) {
    if (d.project === "__all") state.projects.clear();
    else if (state.projects.has(d.project)) state.projects.delete(d.project);
    else state.projects.add(d.project);
    return renderAll();
  }
  if (d.pending) { switchView("text"); return openInText(d.pending); }
  if (d.pendingMore !== undefined) return switchView("confirm");
  if (d.node) {
    const k = d.node;
    if (state.collapsed.has(k)) state.collapsed.delete(k); else state.collapsed.add(k);
    return renderFolder();
  }
  if (d.open) return openInText(d.open);
  if (d.toggle) return toggleReq(d.toggle);
  if (d.pclose !== undefined) return hidePreview();
  if (d.expand) { hidePreview(); return openInText(d.expand); }
  if (d.light) {
    hud(d.light === "close" ? "演示稿：关窗已模拟" : d.light === "min" ? "演示稿：最小化已模拟" : "窗口固定大小");
    return;
  }
  if (d.mb) { e.stopPropagation(); openMb(t, d.mb); return; }
});
document.addEventListener("contextmenu", e => {
  const req = e.target.closest(".req");
  if (req) { e.preventDefault(); openCtx(req.dataset.id, e.clientX, e.clientY); }
});
$("#appleBtn").addEventListener("click", e => { e.stopPropagation(); openMb($("#appleBtn"), "app"); });
$("#appearBtn").addEventListener("click", e => { e.stopPropagation(); openAppearanceMenu(); });
document.addEventListener("click", e => {
  if (e.target.closest("#confirmAll")) doConfirmAll();
});
$("#sheetMask").addEventListener("click", closeSheet);
$("#viewSwitch").addEventListener("click", e => {
  const b = e.target.closest("[data-view]");
  if (b) { state.status = "all"; switchView(b.dataset.view); }
});
$("#invalidToggle").addEventListener("change", e => { state.includeInvalid = e.target.checked; renderAll(true); });
$("#q").addEventListener("input", e => { state.q = e.target.value; state.expandedId = null; renderAll(); });
$("#pendingBtn").addEventListener("click", () => switchView("confirm"));
$("#notesBtn").addEventListener("click", openNotes);
$("#projManage").addEventListener("click", openProjects);
$("#intakeBtn").addEventListener("click", () => openIntake(1));
$("#newBtn").addEventListener("click", focusComposer);
$("#composerSave").addEventListener("click", saveComposer);
$("#composerInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); saveComposer(); } });
$("#composerProj").addEventListener("change", e => { state.composerProj = e.target.value; });
$("#composerInput").addEventListener("input", e => {
  if (!state.composerManual) {
    const g = guessProject(e.target.value);
    if (g !== state.composerProj && $("#composerProj")) { state.composerProj = g; renderComposerProject(); }
  }
});
$("#composerSegsBtn").addEventListener("click", () => {
  const box = $("#composerBox");
  box.classList.toggle("segs-open");
  state.composerManual = true;
  const on = box.classList.contains("segs-open");
  $("#composerSegsBtn").setAttribute("aria-pressed", String(on));
});
$("#clipAccept").addEventListener("click", () => {
  if (!state.clip) return;
  state.composerProj = guessProject(state.clip);
  $("#composerInput").value = state.clip;
  state.clip = "";
  renderClip(); focusComposer();
});
$("#clipClear").addEventListener("click", () => { state.clip = ""; renderClip(); hud("剪贴板已清空"); });
$("#syncBtn").addEventListener("click", () => hud("已同步待办 · C_TODO.md 已更新"));
$("#listenBtn").addEventListener("click", () => hud("文件监听已开启 · 变更进入待修复"));
$("#readBtn").addEventListener("click", () => hud("读取报告：本轮读 6 个文件，省 4 次重复阅读"));
$("#pluginBtn").addEventListener("click", () => hud("插件：文件缓存 / 浏览器 / 记忆检索 已接入"));
$("#snapBtn").addEventListener("click", () => hud("版本快照：已保存需求树 v12"));
$("#multiBtn").addEventListener("click", openProjects);
$("#ruleBtn").addEventListener("click", openRules);
$("#genBtn").addEventListener("click", openGenerate);
$("#starView").addEventListener("mousemove", e => {
  const r = $("#starView").getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
  $("#sky").style.transform = "translate(" + (x * 12).toFixed(1) + "px," + (y * 9).toFixed(1) + "px)";
});
$("#starView").addEventListener("mouseleave", () => { $("#sky").style.transform = ""; });
document.addEventListener("click", e => {
  if (!e.target.closest("#mbMenu") && !e.target.closest("[data-mb]") && !e.target.closest("#appearBtn")) {
    $("#mbMenu").hidden = true;
    $$(".mb-item").forEach(b => b.classList.remove("on"));
  }
  if (!e.target.closest("#ctx")) $("#ctx").hidden = true;
});
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === "Escape") {
    if (!$("#sheet").hidden) { closeSheet(); return; }
    if (!$("#ctx").hidden) { $("#ctx").hidden = true; return; }
    $("#mbMenu").hidden = true;
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#q").focus(); return; }
  if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === "i") { e.preventDefault(); openIntake(1); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "n") { e.preventDefault(); focusComposer(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === ",") { e.preventDefault(); openNotes(); return; }
  if (!typing && (e.key === "n" || e.key === "N")) { e.preventDefault(); focusComposer(); }
});

/* ============================================================
   ?demo= / ?appearance= 用于截图验收
   ============================================================ */
function applyDemo() {
  const params = new URLSearchParams(location.search);
  if (params.get("appearance")) applyTheme(params.get("appearance"));
  const demo = params.get("demo") || "main";
  if (demo === "intake") return openIntake(1);
  if (demo === "intake2") return openIntake(2);
  if (demo === "confirm") {
    commitIntakeSilent();
    renderAll();
    switchView("confirm");
    return;
  }
  if (demo === "star") return switchView("star");
  if (demo === "folder") return switchView("folder");
  switchView("text");
}

/* ============================================================
   启动
   ============================================================ */
applyTheme("system");
buildSky();
renderAll();
switchView("text");
applyDemo();

</script>
</body>
</html>
